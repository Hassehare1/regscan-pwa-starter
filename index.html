<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a"/>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192">
    <title>RegScan – PWA</title>
    <style>
      :root{--bg:#0f172a;--fg:#e2e8f0;--muted:#94a3b8;--accent:#22c55e}
      html,body,#root{height:100%}
      body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
      .wrap{max-width:900px;margin:0 auto;padding:16px}
      .card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
      .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
      button{background:var(--accent);color:#052e16;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
      button:disabled{opacity:.5;cursor:not-allowed}
      .muted{color:var(--muted)}
      .pill{display:inline-block;background:#0b1220;border:1px solid #1f2937;border-radius:999px;padding:6px 10px;font-size:12px}
      video,canvas{width:100%;border-radius:12px;background:#000}
      input{padding:10px 12px;border-radius:8px;border:1px solid #334155;background:#0b1220;color:#e2e8f0;width:100%}
      a.btn{display:inline-block;text-decoration:none}
      .footer{font-size:12px;color:#94a3b8;margin-top:12px}
      .grid{display:grid;grid-template-columns:1fr 1fr; gap:12px}
      @media (max-width: 800px){.grid{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
